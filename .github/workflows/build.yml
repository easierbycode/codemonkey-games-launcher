name: Build binaries

# Builds the CodeMonkey Games Launcher desktop binaries for macOS, Windows and
# Linux/Kazeta, then attaches them to the GitHub Release for the pushed tag.
# The public download page (deploy/download.ts) reads these release assets via
# the GitHub API, so it always points at the latest published version.
#
# Trigger:
#   * push a tag like v1.2.3            -> builds + publishes a release
#   * "Run workflow" with a tag input   -> builds + publishes a release for that tag
#   * "Run workflow" with no tag        -> builds artifacts only (no release)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build & release (e.g. v1.2.3). Leave blank to only build artifacts."
        required: false
        default: ""

# --no-lock everywhere: the launcher pulls Fresh/preact from esm.sh, whose
# build artifacts are not hash-stable over time. Pinning them in deno.lock is
# what kept breaking CI, so the build steps deliberately ignore the lockfile.

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${GITHUB_REF_NAME}"
          else
            REF="${{ github.event.inputs.tag }}"
          fi
          if [ -n "$REF" ]; then
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS (.dmg / .pkg)
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CMG_VERSION: ${{ needs.prepare.outputs.version }}
      APP_NAME: CodemonkeyGamesLauncher
      APP_DISPLAY_NAME: "Codemonkey Games Launcher"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build app bundle, DMG and PKG
        run: |
          deno task build:mac:binary
          deno task appify:mac
          deno task package:mac:dmg
          deno task package:mac:pkg
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp "build/mac/${APP_NAME}.dmg" "out/CodeMonkeyGamesLauncher-${VERSION}-macos.dmg"
          cp "build/mac/${APP_NAME}.pkg" "out/CodeMonkeyGamesLauncher-${VERSION}-macos.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  windows:
    name: Windows (.zip)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cross-compile Windows executable
        run: |
          mkdir -p build/windows
          deno compile --allow-all --no-lock \
            --target x86_64-pc-windows-msvc \
            --output build/windows/codemonkey-games-launcher.exe main.ts
      - name: Stage runtime assets beside the executable
        run: |
          cp -R static build/windows/static
          if [ -d games ]; then cp -R games build/windows/games; fi
      - name: Package zip
        run: |
          mkdir -p out
          (cd build/windows && zip -r "../../out/CodeMonkeyGamesLauncher-${VERSION}-windows.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  kazeta:
    name: Linux / Kazeta (.zip)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build Kazeta bundle
        run: deno task build:kazeta
      - name: Package zip
        run: |
          mkdir -p out
          (cd build && zip -r "../out/CodeMonkeyGamesLauncher-${VERSION}-kazeta.zip" kazeta)
      - uses: actions/upload-artifact@v4
        with:
          name: kazeta
          path: out/*

  release:
    name: Publish GitHub Release
    needs: [prepare, macos, windows, kazeta]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create/update the release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten into a single folder
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          ls -la out
      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
