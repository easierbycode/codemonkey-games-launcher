name: Deploy download page

# Deploys the public download page (deploy/download.ts) to Deno Deploy.
#
# This intentionally does NOT build or deploy the Fresh launcher app. The
# launcher is a desktop app shipped as downloadable binaries (see build.yml);
# only the lightweight, zero-dependency download page is hosted on Deno Deploy.
# That avoids the esm.sh / deno.lock integrity failures that broke every prior
# deploy, because the page imports nothing remote.

on:
  push:
    branches: master
    paths:
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to Deno Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository

    # denoland/deployctl@v1 still declares Node 20 in its metadata and has no
    # Node 24 release yet. This documented opt-in actually runs it on Node 24
    # now (a benign "being forced to run on Node.js 24" notice remains until
    # deployctl ships a Node 24 release, at which point this can be removed).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check download page
        run: deno check --no-lock deploy/download.ts

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "codemonkey-games-launcher"
          entrypoint: "download.ts"
          root: "deploy"
